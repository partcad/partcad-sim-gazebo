# The image the simulation runs in on a machine with no Gazebo of its own:
# `dockerImage` on the `simulation:` entry in `partcad.yaml`, built from
# `container/Dockerfile`.
#
# Built on every pull request that touches it, so that a change to it is proven
# before it lands, and published from `main` only -- the tag PartCAD pulls is
# the one somebody else's simulation runs in, and an unreviewed branch must not
# be able to replace it.
#
# Weekly as well, because the base image moves: OSRF rebuilds
# `osrf/ros:jazzy-simulation` with every ROS sync, and an image that is never
# rebuilt quietly ages into a Gazebo nobody chose.
name: Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "container/**"
      - ".github/workflows/image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "container/**"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/partcad/partcad-sim-gazebo

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:latest" container

      # What PartCAD's `docker` sandbox does with the image, and the two things
      # the plugin needs of it: a Python that can make a virtual environment,
      # and a Gazebo that ROS's setup script puts on PATH.
      - name: Check
        run: |
          set -e
          docker run --rm --entrypoint bash "$IMAGE:latest" -c '
            set -e
            python3 -m venv /tmp/sandbox
            /tmp/sandbox/bin/pip --version
            source /opt/ros/*/setup.bash
            gz sim --versions
          '

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
