# The image the simulation runs in on a machine with no Gazebo of its own:
# `dockerImage` on the `simulation:` entry in `partcad.yaml`, built from
# `container/Dockerfile`.
#
# Built and checked on every pull request that touches it, so that a change to
# it is proven before it lands, and published from `main` only, by a job of its
# own -- the tag PartCAD pulls is the one somebody else's simulation runs in, and
# an unreviewed branch must not be able to replace it.
#
# Weekly as well, because the base image moves: OSRF rebuilds
# `osrf/ros:jazzy-simulation` with every ROS sync, and an image that is never
# rebuilt quietly ages into a Gazebo nobody chose.
name: Image

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "container/**"
      - ".github/workflows/image.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "container/**"
      - ".github/workflows/image.yml"
  schedule:
    - cron: "0 6 * * 1"

# Least privilege: only the job that pushes the image may write packages.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/partcad/partcad-sim-gazebo

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:latest" container

      - name: Check
        run: container/check.sh "$IMAGE:latest"

  # A job of its own, so that the permission to push packages is granted to
  # nothing that runs on a pull request. It builds again rather than handing an
  # image across jobs: a minute of build is cheaper than an artifact of a
  # gigabyte.
  publish:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:latest" container

      # Again, on what is about to be pushed: this is a build of its own, and
      # the base image or a package can have moved since the job above.
      - name: Check
        run: container/check.sh "$IMAGE:latest"

      # Through the environment rather than expanded into the script, so that
      # nothing a workflow expression evaluates to is ever read as shell.
      - name: Publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -e
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:latest"
