# What this package can be checked for without a Gazebo in the room, and then
# with one.
#
# Gazebo is a native program rather than a wheel, so the `pytest` job runs no
# Gazebo, and every test that starts one is skipped there. What is left is
# nearly all of this package: the reader, the writer, and the parsing that
# turns what the server says into what PartCAD reads. The `gazebo` job runs the
# same tests again in the image the simulation runs in, where those are not
# skipped: the worlds the exporter writes, loaded and run, and checked against
# physics with a known answer.
#
# Nightly as well as on a push, because half of what is under test is written
# against PartCAD's sandbox contract -- `ocp_serialize`, `urdf_common`,
# `mass_properties`, `primitive_shapes` -- which lives in a package with a
# release cycle of its own. It is installed from PartCAD's `devel` branch
# rather than from PyPI: this package requires the PartCAD that resolves a
# part's mass and ships `mass_properties`, and a change on `devel` that moves
# the contract should fail here before it is released rather than in somebody's
# `pc info` after.
name: Test

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of what PartCAD supports. What happens in between is not a
        # different answer for code that is this close to the standard library.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          set -e
          python -m pip install --upgrade pip
          # `partcad` for the sandbox contract the reader and the writer are
          # written against, from `devel` -- see the header of this file.
          python -m pip install pytest pyyaml "partcad @ git+https://github.com/partcad/partcad@devel"
          # numpy for the snapshots (`snapshot_raster.py`, `test_snapshot.py`).
          # The simulation gets it from its `pythonRequirements`; the `partcad`
          # wheel does not bring it.
          python -m pip install numpy
          # And the FFmpeg the video of a run is encoded with, as the
          # simulation's `pythonRequirements` asks the sandbox for it.
          python -m pip install "imageio-ffmpeg>=0.5,<1"

      - name: Run the tests
        run: pytest -v

  # The real-Gazebo half, in the image PartCAD runs a simulation in, on what is
  # published as `latest` -- the image every simulation pulls. A change to the
  # image itself is tested on the image it builds, by `image.yml`, with the same
  # script. amd64 alone: `image.yml` runs this on arm64 as well, whenever the
  # image changes or is rebuilt.
  gazebo:
    runs-on: ubuntu-latest
    # The whole suite takes some three minutes there, the install included.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull the image
        run: docker pull ghcr.io/partcad/partcad-sim-gazebo:latest

      - name: Run the tests in it
        run: container/test.sh ghcr.io/partcad/partcad-sim-gazebo:latest
