# The Gazebo plugin for PartCAD: everything PartCAD knows about SDFormat, and
# the simulator that runs it.
#
# Four entry points, one per thing PartCAD can be taught by a package, and all
# four are about the same format:
#
#   export:      write a PartCAD scene out as a `.world` file
#   import:      read a `.world` file back in as a PartCAD scene
#   simulation:  run one in Gazebo and say where everything ended up
#   open:        open one in the Gazebo GUI (`pc ide open --with gazebo`)
#
# They are declared together because they are one piece of knowledge. A reader
# and a writer of the same format disagree the moment they are maintained apart,
# and the simulator is what decides what the file has to say in the first place.
# Until PartCAD 0.8.80 the first, the second and the fourth of these shipped
# inside the `partcad` wheel; they should not, for the reason the simulator never
# did -- Gazebo is somebody's program with a release cycle of its own, and
# SDFormat is Gazebo's. Nothing about either belongs in a CAD tool's wheel.
#
# `urdf` is the counter-example and stays in `//builtin/import`: a URDF describes
# a robot rather than any one engine's world, and ROS, Gazebo, MuJoCo, PyBullet
# and Isaac all read it.

name: //pub/feature/simulate/gazebo
desc: Reading, writing, opening and simulating a Gazebo world, in SDFormat.

# The PartCAD that resolves every part's mass, centre of mass and inertia and
# ships 'mass_properties' in its sandbox contract, which the world writer adds a
# link's shapes up with. An older PartCAD hands it parts with no mass worked out
# and no helper to add them up with, and refuses this package rather than write
# a world of weightless links. A scene's gravity reaches this exporter only
# from partcad/partcad#757 on, which an older PartCAD would silently leave out of
# the world. And the world writer writes the bodies of PartCAD's body rule and
# the joints between them, 'kinematics' (partcad/partcad#784, in 0.8.194), with
# the fix that welds a part fixed to a moving sibling into that sibling's body
# rather than its container's (partcad/partcad#788): without it, a part bolted
# to a pendulum's arm would be written onto its frame and not swing.
#
# partcad/partcad#788 shipped in 0.8.202. The world writer also writes every
# name through PartCAD's 'naming' (partcad/partcad#799), which an older PartCAD
# has no such module for in its sandbox, so the export would fail to import it.
# #799 shipped in 0.8.204, and the run's wall-clock budget this simulation reads
# as request["timeout"] (partcad/partcad#797) in 0.8.205.
#
# And it needs PartCAD's native joint types (partcad/partcad#804), which the
# world writer and the run are written against: 'kinematics' without
# 'CONTINUOUS' or 'CHAIN', a floating child as a free body, 'rezeroed()',
# 'joint_map()' and 'reading()' -- a free body's rates among what it reads --
# and a start outside its bounds among the problems 'bodies()' finds. An older
# PartCAD has none of the three functions in its sandbox, so the export would
# fail to plan its first joint; section 2 of PartCAD's simulation design record
# rules out a fallback for an older one. A link's own physics is read through
# 'kinematics.properties_of()' (partcad/partcad#809), which keeps an assembly's
# entry apart from a part's that shares its full name.
#
# #804 shipped in 0.8.211 and #809 in 0.8.215; 0.8.220 is the first release
# published with both.
#
# And the names file says which parts each body is welded from
# ('kinematics.parts_entry()', read back by 'naming.parts_of()'), which is what
# a run reports as 'parts' beside the loads it reads (partcad/partcad, "loads
# in simulation readings"). 0.8.223 is the release that change is expected to
# ship in; correct this once it has.
partcad: ">=0.8.223"

docs:
  intro: |
    [Gazebo](https://gazebosim.org/) describes a simulation world in
    **SDFormat**, which PartCAD calls `world` after the files it lives in. This
    package is everything PartCAD knows about that format and the program that
    reads it.

    A PartCAD scene exports to a `.world` file and a `.world` file imports back
    as a PartCAD scene, so a world somebody else wrote is a scene you can place
    parts in, and a scene you built out of parts is a world Gazebo can run.

    `pc sim` runs one under gravity and reports where every model ended up, so
    that a part or an assembly can state what it is supposed to do -- or not do
    -- and have that checked. `before` and `after` each carry `time` and a
    `bodies` object: one entry per body, under PartCAD's name for it, holding
    its position `pos` and its orientation `quat` (`w x y z`) in the world's
    frame -- a link hanging off a mechanism's root as much as a model standing
    free. A scene called `world`, which is what PartCAD's default world is, is
    still `world` in what a run reports, although SDFormat reserves the name and
    the file calls it something else. Positions are in **millimetres**, PartCAD's
    unit everywhere, not the metres SDFormat works in -- a validation expression
    is written by whoever wrote the part, against the numbers that part is drawn
    in.

    Beside `bodies`, each reading carries a `joints` object: one entry per
    PartCAD joint, under PartCAD's name for it, in the vocabulary
    [partcad-sim-mujoco](https://github.com/partcad/partcad-sim-mujoco)
    reports joints in -- the terms an interface's `motion:` is written in,
    counted from PartCAD's zero -- so one validation reads both engines:

    | `type` | `pos` | `vel` |
    | --- | --- | --- |
    | `revolute` | degrees | deg/s |
    | `prismatic` | mm | mm/s |
    | `screw` | `{turn: degrees, move: mm}` | the same, per second |
    | `universal` | `{turn: degrees, turn: degrees}` | deg/s each |
    | `ball` | its three turns, and `quat` (`w x y z`) | angular velocity, deg/s |
    | `floating` | its six freedoms against the body it was connected to, and `quat` | by parameter, and `angular` |

    `pos` is a number for a joint of one freedom and an object keyed by
    parameter (`turnZ`, `moveZ`, ...) for one of several. It is read through
    the joint map the export writes beside the world, by PartCAD's own
    `kinematics.reading`. There is no `effort`, which the MuJoCo plugin
    reports: Gazebo's joint state publisher leaves it empty even while a force
    is applied. A `fixed` joint and the joints of a `<static>` model are not
    listed, since nothing there moves. In a world PartCAD did not write, a
    joint is reported by its own coordinate, and a ball, a `universal`,
    `revolute2` or `gearbox` one, and one Gazebo ran with no freedom to move --
    which is what Harmonic's DART makes of a `continuous` joint, so write a
    `revolute` with no `<limit>` instead -- are named in `warnings`. A world
    with no joints to read -- a scene of parts -- reports `joints: {}`, so a
    validation can walk `after["joints"]` without asking first whether there is
    one.

    ### Mechanisms

    A world is written from the bodies PartCAD's body rule finds: every
    element of a scene is a model, everything inside an assembly is attached
    -- welded into one link, or jointed to it -- the child of a floating
    joint is a model of its own, and an element marked `fixed: true` is
    welded to the world. Each joint is one SDFormat joint of SDFormat's own
    type, in SDFormat 1.11: a `revolute` (never a `continuous`, which
    Gazebo's DART builds as a fixed joint), a `prismatic`, a `screw`, a
    `universal` or a `ball`, under PartCAD's name. A cylindrical, a planar or
    a composite joint has no SDFormat type, and the export refuses it, naming
    it, its type and the two ways on -- simulate it in MuJoCo, or model the
    body it stands for and join that by native joints -- rather than write it
    through links of a mass nobody measured. Every joint is re-zeroed at its
    start, since SDFormat states no starting value: Gazebo's zero is where the
    assembly shows the joint, its bounds and the rest shift with it, and a run
    adds the start back. A bound a joint leaves open is left out.

    ### Gazebo itself is not a Python package

    Which is the one way this differs from
    [partcad-sim-mujoco](https://github.com/partcad/partcad-sim-mujoco), where
    `pip install mujoco` is the whole of it. There is no wheel that carries a
    Gazebo, so the simulation runs it the same two ways
    `pc ide open --with gazebo` does: the `gz` on this machine if there is one,
    and otherwise the official image, which `dockerImage` below names and
    PartCAD's `docker` sandbox is built from.

    Reading and writing a world are not like that at all. They are XML and
    arithmetic, no Gazebo is involved, and they run in an ordinary sandbox.

    ### Gravity, and the fluid a scene is filled with

    A scene's `gravity:` (m/s^2) is the world's `<gravity>`; a scene that
    states none gets none, and Gazebo's own `[0, 0, -9.8]`. A run's gravity is,
    in order: `params: {gravity: ...}` on the `simulate:`, the scene's, then
    SDFormat's -- neither the export nor the simulation below states a default,
    because one would beat every scene.

    A scene's `medium:` -- the fluid it is filled with -- is **not** modelled
    here, and the export warns rather than pretending. Gazebo's buoyancy system
    ignores a mesh's `<scale>` on Harmonic, which would buoy PartCAD's
    millimetre meshes by 10^9 times their volume, and naming any system in a
    world drops all of Gazebo's defaults. The MuJoCo plugin models a fluid.
  usage: |
    Import this package and name it from the sections that use it:

    ```yaml
    dependencies:
      sim-gazebo:
        type: git
        url: https://github.com/partcad/partcad-sim-gazebo.git

    scenes:
      warehouse:
        # A world somebody else wrote, read as a PartCAD scene.
        type: sim-gazebo:world
        path: warehouse.world

    assemblies:
      stack:
        type: assy
        simulate:
          stands:
            simulation: sim-gazebo:gazebo
            offset: [[0, 0, 10], [0, 0, 1], 0]
            validation: |
              max(
                  abs(after["bodies"][name]["pos"][2] - before["bodies"][name]["pos"][2])
                  for name in before["bodies"]
              ) < 2.0
    ```

    ```shell
    pc sim -a stack                         # run it and check the validation
    pc export -t sim-gazebo:world -S warehouse   # write the scene back out
    pc ide open --with gazebo warehouse.world   # and look at it
    ```

export:
  world:
    desc: |
      SDFormat, the XML Gazebo describes a simulation world in: a `.world` file
      plus the mesh files it references. It is the format a **scene** is
      exported to (`pc export -S -t sim-gazebo:world`), and it is written from
      the assembly *tree* rather than from the geometry it decodes to -- one
      model per object placed in the scene, named, placed and looked up by what
      the tree says.

      Not to be confused with the `sdf` *part* type, which is a signed distance
      function and has nothing to do with this.
    path: export_world.py
    extension: world
    # OpenCASCADE and nothing else: this is XML and arithmetic, plus the
    # triangulation of what it writes. No Gazebo is involved in writing a world.
    # Stated on the implementation rather than on the package so that writing a
    # world does not pay for a simulator and running one does not pay for a CAD
    # kernel -- see `dockerImage` on the simulation below, which is how Gazebo
    # gets here and is not something pip can answer.
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    # For a PartCAD released before 'shape_tree' only:
    # that is what has it hand this exporter the tree in 'wrapped' rather than
    # the geometry it decodes to. A newer PartCAD hands every exporter the tree
    # as 'shape_tree' beside the geometry, reads no 'decode' at all, and passes
    # this through as a parameter nothing reads. Drop it once 'partcad:' above
    # requires a release that hands 'shape_tree'. See 'tree_of()' in
    # export_world.py.
    decode: false
    # The meshes are written by this exporter itself, so it takes the mesh
    # options too.
    tolerance: 0.1
    angularTolerance: 0.1
    ascii: false
    # Write an '<inertial>' for every link: the mass, centre of mass and inertia
    # each part states, or the ones PartCAD works out from its solid and the
    # density of what it is made of (see 'partcad.physics' in PartCAD).
    inertial: true
    # Weld every body nothing holds to the world -- an element of a scene that
    # is not 'fixed', the root of an assembly exported on its own -- for a file
    # somebody opens to look at, which a scene is. A model with nothing moving
    # in it is written '<static>true</static>', and the root of a mechanism
    # gets a fixed joint to 'world', so that the joints inside it still move: a
    # pendulum exported on its own swings on its hinge. A body 'fixed' in its
    # scene gets that joint whatever this says. The simulation below turns it
    # off. ('flatten', which made every node of geometry a free body of its
    # own, is gone: which nodes are bodies is PartCAD's body rule. Passing it
    # is reported.)
    static: true
    # Whether the links of one model -- the bodies of one mechanism -- collide
    # with each other. SDFormat says they do not unless the model says so.
    # Gazebo's DART never collides the two links of one joint, but two links
    # of one mechanism that no joint joins -- a part on a turning arm and the
    # frame the arm turns in -- are not that: with this on, those can. Off
    # for a scene, which only states where things are; the simulation below
    # turns it on.
    self_collide: false
    # What makes the file usable rather than what the scene says: a world with
    # no light renders black, and one with no ground has nothing to stand on.
    sun: true
    ground_plane: true
    # Write '<file>.names.json' beside the world: which SDFormat name each
    # PartCAD body and joint became, and where each one is -- its model and its
    # link (PartCAD's 'wrappers/naming.py'). SDFormat reserves 'world', which is
    # what PartCAD's default world is called, so that scene's world is written
    # under another name; a run reports under PartCAD's names by reading this.
    # Off for a file somebody exports to open; the simulation below turns it on.
    names_file: false
    # 'world_name' defaults to the object's label, 'mesh_dir' to
    # '<file stem>_meshes' next to the world file, 'mesh_prefix' to empty (which
    # makes the mesh references relative to the world file; a Gazebo model
    # database sets it to 'model://<name>/'), 'version' to the SDFormat version
    # 'gazebo_common.SDF_VERSION' names, 1.11, the newest Gazebo Harmonic reads
    # -- which also decides how a screw's thread is written ('<thread_pitch>'
    # before 1.10, '<screw_thread_pitch>' from it) and whether a mimic is
    # ('<mimic>' from 1.11; reported before, and not enforced by Gazebo
    # Harmonic either way). A bound a joint leaves open is left out in every
    # version, which from 1.10 is -inf or +inf and before it 1e16. 'density'
    # (kg/m^3) is what PartCAD weighs a part at that states no density and is
    # made of nothing that does, and defaults to aluminium's; PartCAD reads it,
    # not this exporter, which is handed the masses already worked out.
    # world_name: <name>
    # mesh_dir: <directory>
    # mesh_prefix: <prefix>
    # version: "1.11"
    # density: 2700.0
    #
    # 'gravity' (m/s^2) writes the world's '<gravity>' over the scene's own.
    # Left unset, deliberately: the gravity of a scene is the scene's to state
    # (`gravity:` on the scene), and a value here would be an explicit override
    # beating every scene that ever stated one. Unset, the world gets the
    # scene's gravity, or no '<gravity>' -- SDFormat's own -- when it states none.
    # gravity: [0.0, 0.0, -9.81]
    #
    # Hand the exporter what the parts report about themselves -- mass, inertia,
    # density, friction, colour, and what PartCAD worked out of what they are
    # made of -- so that it writes those rather than recomputing them or losing
    # them. It is also what PartCAD hands a scene's world under: its gravity and
    # the fluid it is filled with.
    properties: true

import:
  world:
    desc: |
      SDFormat, the XML Gazebo describes a simulation world in: models placed in
      a world, each model holding links. A world is an arrangement of things
      rather than one product, so it is a scene and never an assembly.

      Reading a world is not running one: this is XML and arithmetic, and no
      Gazebo installation is involved. Running it is `pc sim`.
    path: import_world.py
    extension: world
    kinds: [scene]
    noun: world
    # OpenCASCADE, for the primitives a world names instead of a mesh. No
    # Gazebo, for the reason the exporter needs none.
    pythonRequirements:
      - cadquery-ocp==7.9.3.1.1
    # How many digits the placements coming back are rounded to. Six is a
    # micrometre at millimetre scale, which is finer than any world states.
    precision: 6
    # How deeply models may nest before the reader stops descending and reports
    # it. An '<include>' cycle is not what this guards -- an include carries its
    # own depth and stops at the same limit.
    max_depth: 16
    # Build a link from its visual geometry rather than its collision geometry:
    # true for every link, or a list of the link names it applies to.
    ignoreCollision: false
    dropped:
      joint: "joints (the scene shows the models at their initial pose)"
      light: lights
      sensor: sensors
      plugin: "simulator plugins"
      actor: actors
      physics: "physics settings"
      collision: "collision geometry (kept as parts of its own, but not placed)"
      visual: "visual geometry (kept as parts of its own, but not placed)"
      geometry: "shapes PartCAD has no geometry for"
      include: "included models that could not be resolved"

simulation:
  gazebo:
    desc: Run the scene in Gazebo under gravity and report where everything ended up.
    path: simulate_gazebo.py
    # The format the scene is handed over in, resolved in this package: the
    # `export:` entry above is what writes it. PartCAD exports the scene before
    # this script is started, so this is what decides which exporter runs rather
    # than anything the script says at runtime.
    format: world
    # How that export is asked for. A scene states where things are, so the
    # exporter writes every model '<static>true</static>' by default -- and a
    # simulation of a world whose free bodies cannot move has nothing to
    # report. So a run asks for the opposite. It is stated here, by the plugin,
    # because the plugin is what knows it. For the same reason it asks for the
    # bodies of a mechanism to collide with each other, which SDFormat says they
    # do not.
    formatOptions:
      static: false
      self_collide: true
      # What lets the run report every body and joint under PartCAD's name,
      # and every body's pose in the world's frame; see `names_file` above.
      names_file: true
    # Where Gazebo comes from on a machine that does not have it.
    #
    # Unlike MuJoCo, Gazebo is not a Python package and there is no wheel that
    # carries one, so `pythonRequirements` cannot answer this the way it answers
    # everything else here. `dockerImage` says which image the `docker` sandbox
    # is built from, and this one has `gz` in it; a machine using another
    # sandbox ignores it and this script looks for `gz` on PATH instead. Either
    # way it is the same two places `pc ide open --with gazebo` looks, which is
    # the point -- one answer to "where is Gazebo on this machine", not two.
    #
    # This package's own image (`container/Dockerfile`): ROS Jazzy's simulation
    # stack, which is Gazebo Harmonic, built the way OSRF builds
    # `osrf/ros:jazzy-simulation` -- `ros:jazzy-ros-base` and the
    # `ros-jazzy-simulation` packages -- because OSRF publishes that image for
    # amd64 alone. This one is published for linux/amd64 and linux/arm64,
    # 'latest' a manifest list of both, so that a machine of either starts it.
    # ROS installs Gazebo off PATH, so this script finds it through ROS's setup
    # script (see 'ros_environment'). Jazzy is the long-term support release,
    # and pairs with Harmonic.
    dockerImage: ghcr.io/partcad/partcad-sim-gazebo:latest
    # What this script imports beyond the standard library: numpy draws the
    # snapshots (see 'snapshot_raster.py'). A sandbox's environment does not see
    # the numpy the image may have of its own.
    pythonRequirements:
      - numpy
    # How long, in seconds of simulated time. Ten is long enough for something
    # that is going to fall over to have fallen over and come to rest.
    duration: 10.0
    # The integration step, in seconds, written into the world as its
    # '<physics><max_step_size>': Gazebo's own, 0.001, unless this says
    # otherwise. The run goes at real time whatever the step.
    # timestep: 0.001
    #
    # The gravity to run under, in m/s^2, written into the world before Gazebo
    # loads it. No default, for the reason the export above has none: the world
    # already carries the scene's gravity, and a default here would replace it
    # in every run. (It also used to be reported as what the run was under
    # without ever reaching Gazebo, which applied SDFormat's 9.8.) A `simulate:`
    # that wants another for one run says `params: {gravity: [0, 0, -1.62]}`.
    # gravity: [0.0, 0.0, -9.81]
    #
    # How long the whole run may take, in wall-clock seconds. Not stated here,
    # so that it is PartCAD's to work out: the larger of five minutes and ten
    # seconds for each simulated one, unless a 'simulate:' says
    # 'params: {timeout: ...}' (or the machine says 'simulation.timeout').
    # PartCAD hands it to the script as 'timeout' and stops the run when it is
    # spent; the script stops itself a little before, saying how far it got.
    # Where PartCAD hands none, the script waits 300 seconds. A world is stepped
    # at about real time, so this is about the machine and the duration rather
    # than about the simulation.
    # timeout: 300.0
    #
    # How long the server may take to publish its first pose, in wall-clock
    # seconds. A server that has said nothing by then is one that hung while it
    # loaded the world, or is publishing where nobody listens.
    startup_timeout: 120.0
    # Report where every model is at each of these many evenly spaced instants,
    # as 'samples'. Zero -- the default -- reports only 'before' and 'after',
    # which is what a validation reads. Gazebo publishes poses sixty times a
    # second of the wall clock, so a run that asks for more readings a
    # simulated second runs slower than real time to give them; one that gets
    # fewer than it asked for says so in 'warnings'.
    samples: 0
    # Report what acts on every body in every reading: its weight, and what
    # each of its joints passes it, read off a force-torque sensor the run puts
    # on every joint -- and which parts each body is welded from ('parts').
    # What a stress analysis of a part starts from; see "Loads" in README.md
    # for what Gazebo does not give. False reports poses alone.
    loads: true
    # The two pictures PartCAD asks every run for, of the world before and
    # after, are not configured here: PartCAD says where they go and where they
    # are taken from (the scene's own 'render: png:' viewpoint) in the request.
    # They are drawn on the CPU out of the world file and the pose messages; see
    # 'snapshot_raster.py' for why not with Gazebo's own renderer.

open:
  gazebo:
    displayName: Gazebo
    # The simulator's own image for the current Gazebo, and the same one the
    # simulation above runs in. `--docker-image` is the answer for anyone who
    # wants another (`osrf/gazebo` for Gazebo Classic, say).
    image: gazebosim/gz-harmonic:latest
    # Three generations of one program, newest first: `gz sim` today,
    # `ign gazebo` in the Ignition years, and `gazebo` for Gazebo Classic.
    # Whichever the machine has is the one used.
    binaries: [gz, ign, gazebo]
    binaryArgs:
      gz: [sim]
      ign: [gazebo]
    macosApps: [Gazebo.app]
    windowsGlobs: ["Gazebo*/bin/gz.exe"]
    flatpakId: org.gazebosim.Gazebo
    # Gazebo reads SDFormat and no other description of an arrangement. A scene
    # given as anything else -- an MJCF model, above all -- is written out as a
    # world first, which is `pc export -t world` and so is the daemon's work.
    sceneType: world
